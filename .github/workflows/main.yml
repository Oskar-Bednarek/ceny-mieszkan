name: Update XML Daily

permissions:
  contents: write

concurrency:
  group: ceny-mieszkan-publisher
  cancel-in-progress: false

on:
  schedule:
    # Cron GitHuba działa w UTC. Minuta 17 ogranicza ryzyko opóźnień
    # występujących najczęściej na początku pełnej godziny.
    # Uruchomienie: 01:17 czasu polskiego zimą, 02:17 latem.
    - cron: '17 0 * * *'
  
  workflow_dispatch:  # Możliwość uruchomienia ręcznego

jobs:
  generate-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Warsaw
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Generate XML and MD5
        run: |
          python excel_to_xml.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add kerim-ceny-mieszkan.xml
          git add kerim-ceny-mieszkan.md5
          git add csv/**/*.csv
          if [ -d history ]; then git add history; fi
          git diff --quiet && git diff --staged --quiet || git commit -m "Automatyczna aktualizacja danych - $(date +'%Y-%m-%d')"
          git push
